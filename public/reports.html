<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Reports</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .header-title { text-align: center; color: #003399; margin-bottom: 5px; }
        .sub-header { text-align: center; color: #555; font-size: 14px; margin-bottom: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: auto; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        h2 { color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        .controls { margin-bottom: 15px; display: flex; gap: 15px; flex-wrap: wrap;}
        .controls-inner { flex: 1; min-width: 200px; }
        select, input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; margin-top: 5px;}
        
        .toggle-inv-btn { background-color: #e74c3c; padding: 15px; font-size: 18px; border-radius: 8px; margin-bottom: 15px; color: white; text-decoration: none; display: block; text-align: center; border: none; cursor: pointer; width: 100%;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .report-table th { background-color: #34495e; color: white; text-align: center; padding: 10px; border: 1px solid #ddd;}
        .report-table td { text-align: center; border: 1px solid #ddd; padding: 10px;}
        .report-table .section-title { text-align: left; font-weight: bold; background: #ecf0f1; }

        /* Print and Excel Buttons */
        .export-btn-group { display: flex; gap: 15px; margin-top: 20px; }
        .btn-print { background-color: #2980b9; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; flex: 1; font-weight: bold;}
        .btn-excel { background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; flex: 1; font-weight: bold;}
        
        /* Print Styles - Ye ensure karega ki print me buttons na dikhein */
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .box { box-shadow: none; border: none; padding: 0; }
        }
    </style>
</head>
<body>

    <h1 class="header-title">HINDUSTAN UNILEVER LIMITED</h1>
    <div class="sub-header">KIDDERPORE FACTORY - CANTEEN REPORTS</div>

    <div class="container no-print" style="justify-content: center; margin-bottom: 20px;">
        <a href="pos.html" class="toggle-inv-btn" style="max-width: 1200px;">⬅ Back to POS Billing</a>
    </div>

    <div class="container">
        <div class="box" style="width: 100%;">
            <h2 class="no-print">📊 Canteen Detailed Report</h2>
            <div class="controls no-print">
                <div class="controls-inner">
                    <label><strong>Report Type:</strong></label>
                    <select id="reportType" onchange="fetchReportData()">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
                <div class="controls-inner">
                    <label><strong>Reference Date:</strong></label>
                    <input type="date" id="reportDate" onchange="fetchReportData()">
                </div>
            </div>

            <!-- Report Table -->
            <table class="report-table" id="reportResult" style="display: none; margin-top: 15px; width: 100%;">
                <thead>
                    <tr>
                        <th>Meal Type</th>
                        <th>Veg Count</th>
                        <th>Non-Veg Count</th>
                        <th>Total Count</th>
                        <th>Total Amount (₹)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="section-title">Breakfast</td>
                        <td>-</td><td>-</td>
                        <td id="rep-bf-cnt">0</td><td id="rep-bf-amt">0</td>
                    </tr>
                    <tr>
                        <td class="section-title">Lunch</td>
                        <td id="rep-lu-veg">0</td><td id="rep-lu-nonveg">0</td>
                        <td id="rep-lu-total">0</td><td id="rep-lu-amt">0</td>
                    </tr>
                    <tr>
                        <td class="section-title">Evening Snacks</td>
                        <td id="rep-ev-veg">0</td><td id="rep-ev-nonveg">0</td>
                        <td id="rep-ev-total">0</td><td id="rep-ev-amt">0</td>
                    </tr>
                    <tr>
                        <td class="section-title">Night Snacks</td>
                        <td>-</td><td>-</td>
                        <td id="rep-ni-cnt">0</td><td id="rep-ni-amt">0</td>
                    </tr>
                    <tr style="background-color: #f1f2f6; font-weight: bold;">
                        <td colspan="3" style="text-align: right;">GRAND TOTAL:</td>
                        <td id="rep-grand-total">0</td>
                        <td id="rep-grand-rev">₹ 0</td>
                    </tr>
                </tbody>
            </table>

            <!-- Export Buttons (Hidden until data is fetched) -->
            <div class="export-btn-group no-print" id="exportSection" style="display: none;">
                <button class="btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
                <button class="btn-excel" onclick="exportToExcel()">📊 Download Excel (CSV)</button>
            </div>

        </div>
    </div>

    <script>
        window.onload = function() {
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("reportDate").value = today;
        };

        async function fetchReportData() {
            let selectedDate = document.getElementById("reportDate").value;
            let reportType = document.getElementById("reportType").value;
            if (!selectedDate) return;

            try {
                let response = await fetch(`/api/get-report?type=${reportType}&date=${selectedDate}`);
                if (response.ok) {
                    let data = await response.json();
                    document.getElementById("reportResult").style.display = "table";
                    document.getElementById("exportSection").style.display = "flex"; // Show Export Buttons
                    
                    document.getElementById("rep-bf-cnt").innerText = data.bfCount || 0;
                    document.getElementById("rep-bf-amt").innerText = data.bfAmt || 0;
                    
                    document.getElementById("rep-lu-veg").innerText = data.luVeg || 0;
                    document.getElementById("rep-lu-nonveg").innerText = data.luNonVeg || 0;
                    document.getElementById("rep-lu-total").innerText = (data.luVeg || 0) + (data.luNonVeg || 0);
                    document.getElementById("rep-lu-amt").innerText = data.luAmt || 0;
                    
                    document.getElementById("rep-ev-veg").innerText = data.evVeg || 0;
                    document.getElementById("rep-ev-nonveg").innerText = data.evNonVeg || 0;
                    document.getElementById("rep-ev-total").innerText = (data.evVeg || 0) + (data.evNonVeg || 0);
                    document.getElementById("rep-ev-amt").innerText = data.evAmt || 0;
                    
                    document.getElementById("rep-ni-cnt").innerText = data.niCount || 0;
                    document.getElementById("rep-ni-amt").innerText = data.niAmt || 0;

                    document.getElementById("rep-grand-total").innerText = data.grandTotal || 0;
                    document.getElementById("rep-grand-rev").innerText = "₹ " + (data.totalRevenue || 0);
                } else {
                    document.getElementById("reportResult").style.display = "none";
                    document.getElementById("exportSection").style.display = "none"; // Hide Export Buttons
                    alert("Is date ka data abhi server par maujood nahi hai.");
                }
            } catch (error) {
                console.error("Report fetch error:", error);
            }
        }

        // --- EXPORT TO EXCEL (CSV) LOGIC ---
        function exportToExcel() {
            let date = document.getElementById("reportDate").value;
            let type = document.getElementById("reportType").options[document.getElementById("reportType").selectedIndex].text;
            
            // CSV Header Setup
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += `HUL Kidderpore Factory - Canteen Report\n`;
            csvContent += `Report Type:,${type}\n`;
            csvContent += `Date:,${date}\n\n`;
            
            // HTML Table se rows aur columns uthana
            let table = document.getElementById("reportResult");
            let rows = table.querySelectorAll("tr");
            
            rows.forEach(function(row) {
                let rowData = [];
                let cols = row.querySelectorAll("td, th");
                cols.forEach(function(col) {
                    // Data clean karke array me daalna
                    rowData.push('"' + col.innerText.replace(/"/g, '""') + '"');
                });
                csvContent += rowData.join(",") + "\n";
            });

            // CSV Download karwana
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Canteen_Report_${date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
